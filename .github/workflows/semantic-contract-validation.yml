name: Explicit financial-answer semantics validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-contract-challenge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-controls.txt
      - run: pip install -r requirements-controls.txt
      - name: Existing and new adversarial regression tests
        run: python -m pytest -q
      - name: Verify every captured source, constructed input, complete answer and fault decision
        run: python benchmark_semantic_contract.py --mode replay
      - uses: actions/upload-artifact@v4
        with:
          name: financial-answer-semantic-contract
          path: reference/semantic_contract/
